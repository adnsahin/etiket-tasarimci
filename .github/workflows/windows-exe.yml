name: Windows EXE Oluştur

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "app/**"
      - "main.js"
      - "preload.js"
      - "package.json"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    name: Taşınabilir ve Kurulum EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v5

      - name: Node.js 24 ortamını hazırla
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Ortam bilgilerini göster
        shell: pwsh
        run: |
          node --version
          npm --version
          Get-ChildItem -Force
          if (!(Test-Path "app/index.html")) { throw "app/index.html bulunamadı" }
          if (!(Test-Path "package.json")) { throw "package.json bulunamadı" }

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: Windows EXE dosyalarını oluştur
        run: npm run build:github
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""

      - name: Oluşan EXE dosyalarını kontrol et
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) { throw "dist klasörü oluşmadı" }
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length
          if (!(Get-ChildItem -Path dist -Filter *.exe -File)) { throw "EXE dosyası oluşmadı" }

      - name: EXE dosyalarını indirmeye hazırla
        uses: actions/upload-artifact@v4
        with:
          name: Etiket-Tasarimci-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
